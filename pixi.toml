[workspace]
authors = ["d-laub <dlaub@ucsd.edu>"]
channels = ["nvidia", "conda-forge", "pytorch", "bioconda"]
description = "Benchmarks and figures for the GenVarLoader paper."
name = "gvl-paper"
platforms = ["linux-64"]
version = "0.2.0"

[environments]
default = ["bench"]
basenji2 = ["basenji2"]
# Pinned to genvarloader 0.27.0 — the release line that directly targets the GVL >=0.21
# throughput/OOM regressions (see GenVarLoader/docs/superpowers/REGRESSIONS.md). Runs the
# manuscript throughput + memory grid in hap_track_throughput/ (source of truth,
# results_gvl027/). CPU torch — the benchmark has no GPU workload.
# (The old bench061 / genvarloader 0.6.1 env was removed 2026-06-23 along with its
# results and 0.6.1-API scripts; recover from git history if a re-run is ever needed.)
bench027 = ["bench027"]
# genoray's SVAR2 batch-query API (SparseVar2._find_ranges/_gather_ranges, M6b)
# needs genoray>=3.3.1, but genvarloader 0.24.x (pinned in `bench` above) caps
# genoray <3 via its own requires_dist. Rather than bump genvarloader across
# that major boundary for the whole `bench` env — and risk the version
# sensitivity documented below for gpu_utilization/ and hap_track_throughput/
# — the SVAR2 variant-throughput bench scripts get their own isolated env.
svar2 = ["svar2"]

[feature.bench.dependencies]
python = "3.12.*"
ipykernel = "*"
ipywidgets = "*"
bcftools = ">=1.21"

[feature.bench.pypi-dependencies]
torch = { version = "==2.10.0", index = "https://download.pytorch.org/whl/cu126" }
pytorch-lightning = ">=2.4.0,<3"
numpy = "<2"
tqdm = ">=4.67.1,<5"
polars = ">=1.37.1,<2"
typing-extensions = ">=4.14,<5"
einops = ">=0.8.0,<0.9"
jupyterlab = ">=4.3.3,<5"
genvarloader = { version = ">=0.24.1,<0.25", extras = ["cli"] }
# Match bench027's genoray so bench_svar_vcf_plink.py imports a consistent API.
genoray = "==2.9.0"
bpnet-lite = ">=0.8.1,<0.9"
seqmodels = "==0.0.3"
cyclopts = ">=4.5.1, <5"
psutil = "*"
seaborn = "*"
rich = "*"
matplotlib = "*"
statsmodels = ">=0.14.6, <0.15"

[feature.bench.tasks]
i-kernel = "ipython kernel install --user --name gvl-paper-bench"

[feature.bench027.dependencies]
python = "3.12.*"

[feature.bench027.pypi-dependencies]
# Bumped 0.26.0 -> 0.27.0: 0.26.0's buffered dataloader forced drop_last=True,
# yielding 0 batches when batch_size > n_instances (hung the tcga-atac probe cells).
# Fixed in 0.27.0.
genvarloader = "==0.27.0"
# genoray 2.9.0 adds is_symbolic / is_breakend filters used by the hap-safe SVAR
# conversion (benchmark_svar_convert.py). Pin explicitly (was transitive).
genoray = "==2.9.0"
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
cyclopts = ">=4.5.1, <5"
polars = ">=1"
psutil = "*"
pytest = "*"

[feature.svar2.dependencies]
python = "3.12.*"
# conftest.py's svar2_store fixture shells out to these directly; declare them
# rather than relying on the user's global pixi (/carter/.../.pixi/bin).
bcftools = ">=1.21"
samtools = ">=1.21"

[feature.svar2.pypi-dependencies]
# LOCAL BUILD, not a release. bench_svar2.py's timed read needs genoray's
# read-bound flat gather (`SparseVar2._find_haps_ranges` /
# `._gather_haps_readbound`), which existed in the Rust core as
# `query::gather_haps_readbound` but had no PyO3 binding through 3.4.0. The
# bindings were added on genoray branch `worktree-svar2-readbound-bindings`,
# commit 361c426815a98da37f19e4ffc5e58e6ed8157798 (tag 3.4.0 plus one commit),
# and built as the abi3 wheel below. Its version string is
# `3.5.0.dev0+readbound` precisely so this artifact can never be mistaken for
# released 3.4.0.
#
# Why the new binding and not the released API: `_gather_ranges`' RangesBundle
# is inherently a region x sample RECTANGLE (gather.rs indexes its dense-carrier
# check by sample SLOT), so covering the benchmark's arbitrary (region, sample)
# pair set costs either the whole cross-product in one call or one call per
# unique sample -- and every `gather_ranges` call rebuilds the contig-wide dense
# union. Measured at query_length=2048: 341 per-sample calls cost 1287-1382 ms
# vs 79-81 ms for one cross-product call that gathers 341x the requested cells.
# Neither shape measures SVAR2's read cost.
#
# Consequence for reproduction: this path only resolves on the machine that
# built the wheel. Rebuild with
#   git -C <genoray> worktree add <dir> 361c426 && cd <dir> \
#     && pixi run maturin build --release --features abi3 --out dist
# then copy the wheel to the path below -- or repoint this at a released genoray
# once the bindings land upstream (the floor then becomes >=3.5,<4).
#
# The SVAR2 WRITER version is a separate concern, unchanged by this: 361c426
# branches from 3.4.0 and touches only read-path files, and FORMAT_VERSION is 1
# at both 3.3.1 and 3.4.0, so the 3.3.1-written full-cohort 1kGP store (Task 5)
# and the n-sweep subset stores BUILD_SVAR2_FROM_PGEN writes here stay mutually
# readable. (The comment that used to sit here claimed the `>=3.3.1,<4` floor
# made both land on 3.3.1; the committed lock resolved 3.4.0, so that was false.)
genoray = { path = "/carter/users/dlaub/projects/genoray/wheelhouse/genoray-3.5.0.dev0+readbound-cp310-abi3-manylinux_2_28_x86_64.whl" }
numpy = "<2"
polars = ">=1.37.1,<2"
cyclopts = ">=4.5.1, <5"
psutil = "*"

[feature.basenji2.dependencies]
python = "3.12.*"

[feature.basenji2.pypi-dependencies]
torch = { version = "==2.6.0", index = "https://download.pytorch.org/whl/cu126" }
seaborn = "*"
anndata = "*"
polars = "*"
ipykernel = "*"
ipywidgets = "*"
uv = "*"
mpl-scatter-density = "*"
astropy = "*"
upsetplot = "*"
pysam = "!=0.23.1"
basenji2-pytorch = "==0.1.2"
genvarloader = "==0.20.0"

[feature.basenji2.system-requirements]
cuda = "12.2"

[feature.basenji2.tasks]
i-kernel = "ipython kernel install --user --name gvl-basenji2"

[pypi-dependencies]
pyranges1 = ">=1.3.2, <2"
pytest = ">=9.0.3, <10"
ultraplot = ">=2.3.0, <3"
