[workspace]
authors = ["d-laub <dlaub@ucsd.edu>"]
channels = ["nvidia", "conda-forge", "pytorch", "bioconda"]
description = "Benchmarks and figures for the GenVarLoader paper."
name = "gvl-paper"
platforms = ["linux-64"]
version = "0.2.0"

[environments]
default = ["bench"]
basenji2 = ["basenji2"]
# Pinned to genvarloader 0.6.1 — the version the manuscript throughput benchmarks
# (results/{hap,track}_results.csv) were collected on. Later GVL releases regressed
# haplotype/track dataloading ~10-30x in throughput and several-fold in peak RAM
# (see GenVarLoader/REGRESSIONS.md). Do NOT regenerate those CSVs on a newer GVL
# without re-validating. Old 0.6.1-API scripts live in hap_track_throughput/bin_gvl061/.
bench061 = ["bench061"]
# Pinned to genvarloader 0.27.0 — the release line that directly targets the GVL >=0.21
# throughput/OOM regressions (see GenVarLoader/docs/superpowers/REGRESSIONS.md). Used ONLY by the
# parity probe in hap_track_throughput/bin_gvl027/ to compare against the 0.6.1 baseline
# (results/{hap,track}_results.csv). CPU torch — the benchmark has no GPU workload.
bench027 = ["bench027"]

[feature.bench.dependencies]
python = "3.12.*"
ipykernel = "*"
ipywidgets = "*"
bcftools = ">=1.21"

[feature.bench.pypi-dependencies]
torch = { version = "==2.10.0", index = "https://download.pytorch.org/whl/cu126" }
pytorch-lightning = ">=2.4.0,<3"
numpy = "<2"
tqdm = ">=4.67.1,<5"
polars = ">=1.37.1,<2"
typing-extensions = ">=4.14,<5"
einops = ">=0.8.0,<0.9"
jupyterlab = ">=4.3.3,<5"
genvarloader = { version = ">=0.24.1,<0.25", extras = ["cli"] }
# Match bench027's genoray so bench_svar_vcf_plink.py imports a consistent API.
genoray = "==2.9.0"
bpnet-lite = ">=0.8.1,<0.9"
seqmodels = "==0.0.3"
cyclopts = ">=4.5.1, <5"
psutil = "*"
seaborn = "*"
rich = "*"
matplotlib = "*"
statsmodels = ">=0.14.6, <0.15"

[feature.bench.tasks]
i-kernel = "ipython kernel install --user --name gvl-paper-bench"

[feature.bench061.dependencies]
python = "3.12.*"

[feature.bench061.pypi-dependencies]
genvarloader = "==0.6.1"
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
typer = "*"
filelock = "*"
psutil = "*"
# numba pinned to the gvl-0.6.1 era (released 2024-11-25). Newer numba (was floating to
# 0.65.1) miscompiles 0.6.1's reconstruct_haplotypes_from_sparse kernel -> SystemError
# during haplotype reconstruction. See HANDOFF.md.
numba = "==0.60.*"
numpy = "<2"
polars = ">=1"

[feature.bench027.dependencies]
python = "3.12.*"

[feature.bench027.pypi-dependencies]
# Bumped 0.26.0 -> 0.27.0: 0.26.0's buffered dataloader forced drop_last=True,
# yielding 0 batches when batch_size > n_instances (hung the tcga-atac probe cells).
# Fixed in 0.27.0.
genvarloader = "==0.27.0"
# genoray 2.9.0 adds is_symbolic / is_breakend filters used by the hap-safe SVAR
# conversion (benchmark_svar_convert.py). Pin explicitly (was transitive).
genoray = "==2.9.0"
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
cyclopts = ">=4.5.1, <5"
polars = ">=1"
psutil = "*"
pytest = "*"

[feature.basenji2.dependencies]
python = "3.12.*"

[feature.basenji2.pypi-dependencies]
torch = { version = "==2.6.0", index = "https://download.pytorch.org/whl/cu126" }
seaborn = "*"
anndata = "*"
polars = "*"
ipykernel = "*"
ipywidgets = "*"
uv = "*"
mpl-scatter-density = "*"
astropy = "*"
upsetplot = "*"
pysam = "!=0.23.1"
basenji2-pytorch = "==0.1.2"
genvarloader = "==0.20.0"

[feature.basenji2.system-requirements]
cuda = "12.2"

[feature.basenji2.tasks]
i-kernel = "ipython kernel install --user --name gvl-basenji2"

[pypi-dependencies]
pyranges1 = ">=1.3.2, <2"
pytest = ">=9.0.3, <10"
ultraplot = ">=2.3.0, <3"
